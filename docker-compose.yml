version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: nivasio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nivasio-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nivasio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nivasio-net

  # Spring Boot Backend
  backend:
    build: ./backend
    container_name: nivasio-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - WA_MOCK_MODE=${WA_MOCK_MODE}
      - WA_VERIFY_TOKEN=${WA_VERIFY_TOKEN}
      - WA_APP_SECRET=${WA_APP_SECRET}
      - WA_ACCESS_TOKEN=${WA_ACCESS_TOKEN}
      - WA_PHONE_NUMBER_ID=${WA_PHONE_NUMBER_ID}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SLA_CHECK_INTERVAL=${SLA_CHECK_INTERVAL}
      - SLA_DEFAULT_THRESHOLD=${SLA_DEFAULT_THRESHOLD}
    depends_on:
      - mongo
      - redis
    networks:
      - nivasio-net

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: nivasio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nivasio-net

  # Cloudflare Tunnel (optional — set CLOUDFLARE_TUNNEL_TOKEN in .env)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nivasio-cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiNjk5NDA0NzljNGMxMDExMDJjZTc2NzZjZGJkMzJmNjUiLCJ0IjoiYTc2OTZmYzctYzhlYS00M2Q4LTlhMGItNmI1OWZiODljM2JhIiwicyI6Ik0yUmhOR0l4TnpFdE5XUmlNQzAwTWpNeExXRTRZalF0T1RNNU1qSXlNbVV5WmpJMCJ9
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - nivasio-net
    profiles:
      - tunnel

volumes:
  mongo-data:
  redis-data:

networks:
  nivasio-net:
    driver: bridge