server:
  port: 8080

spring:
  application:
    name: nivasio-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://nivasio:pDe5HuxfYjMtildp@nivasio.wnccwbz.mongodb.net/nivasio?appName=Nivasio}
    redis:
      url: ${REDIS_URL:rediss://default:gQAAAAAAASQ2AAIncDE2NmRkYjUzYWQ0NDg0ZmJjOTlmN2ZlNjIwNTZhNjEwZnAxNzQ4MDY@pleased-sailfish-74806.upstash.io:6379}

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:nivasio-jwt-secret-key-for-development-only-change-in-production-must-be-at-least-64-bytes}
    access-expiry-ms: 900000      # 15 minutes
    refresh-expiry-ms: 604800000  # 7 days
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  whatsapp:
    mock-mode: ${WA_MOCK_MODE:true}
    verify-token: ${WA_VERIFY_TOKEN:nivasio-verify}
    app-secret: ${WA_APP_SECRET:}
    access-token: ${WA_ACCESS_TOKEN:}
    phone-number-id: ${WA_PHONE_NUMBER_ID:}
  sla:
    check-interval-ms: ${SLA_CHECK_INTERVAL:300000}  # 5 minutes
    default-threshold-minutes: ${SLA_DEFAULT_THRESHOLD:120}  # 2 hours

# Actuator
management:
  endpoint:
    health:
      show-details: always

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
